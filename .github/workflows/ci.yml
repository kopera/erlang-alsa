name: CI
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        otp-version: ['27.3', '28.5', '29.1']
    runs-on: ubuntu-latest
    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install --yes libasound2-dev
    - name: Checkout
      uses: actions/checkout@v7
    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp-version }}
        rebar3-version: '3.27.1'
    - name: Compile
      run: rebar3 compile
    - name: Run tests
      run: rebar3 eunit
    - name: Run xref
      run: rebar3 xref
    - name: Build the docs
      run: |
        rebar3 ex_doc
        test -f doc/alsa_pcm.html
        test -f doc/alsa_ctl.html
        test -f doc/alsa_mixer.html
